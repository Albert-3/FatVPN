services:
  postgres:
    image: postgres:16
    container_name: fatvpn-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fatvpn
      # Reads from .env so rotating it is not an edit to a tracked file; the
      # default keeps an existing deploy working unchanged.
      # ⚠️ Setting this alone does NOT rotate anything: POSTGRES_PASSWORD is only
      # read when the data directory is first created, and this one has existed
      # since 2026-07. A real rotation is two steps in this order — `ALTER USER
      # fatvpn WITH PASSWORD '<new>'` inside the running container, then the same
      # value in .env and `docker compose up -d`. The reverse order locks the BFF
      # out of a database that still has the old password.
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-fatvpn_dev}"
      POSTGRES_DB: fatvpn
    ports:
      # Localhost only — Docker-published ports bypass ufw, so this bind is the
      # real protection for Postgres.
      - "127.0.0.1:5433:5432"
    volumes:
      - fatvpn-postgres-data:/var/lib/postgresql/data

  bff:
    build: .
    container_name: fatvpn-bff
    restart: unless-stopped
    ports:
      # Public: the shipped app builds still point at http://87.121.221.229:5030.
      # Kept open alongside HTTPS so phones already in people's hands keep
      # working; retire it once every build has moved to the domain.
      - "5030:5030"
    environment:
      ConnectionStrings__FatVpn: "Host=fatvpn-postgres;Port=5432;Database=fatvpn;Username=fatvpn;Password=${POSTGRES_PASSWORD:-fatvpn_dev}"
      # Every name this container is legitimately reached by, and no others: with
      # the default "*" any Host header is accepted, which is what lets a request
      # arrive claiming to be somewhere else entirely. Host filtering ignores the
      # port, so no ":5030" here.
      # ⚠️ A name missing from this list gets 400, not a warning. `fatvpn-bff` is
      # how the bot reaches us over the shared docker network — drop it and
      # pairing stops working; the bare IP is how the app builds already on
      # people's phones reach us — drop it and they stop working. Nothing may
      # leave this list before the thing that uses it is actually gone.
      AllowedHosts: "api.fatklyuchi.space;87.121.221.229;fatvpn-bff;bff;localhost;127.0.0.1"
      Jwt__Secret: "${JWT_SECRET}"
      Jwt__Issuer: "FatVpn.Bff"
      Jwt__Audience: "FatVpn.App"
      Remnawave__BaseUrl: "https://z.fatvdsnvv.space"
      Remnawave__ApiToken: "${REMNAWAVE_API_TOKEN}"
      Bot__Secret: "${BOT_SECRET}"
      # Without this the device-key hash is unsalted, so a leaked database gives
      # up its per-install identifiers to a rainbow table. Startup refuses to run
      # without it outside Development.
      Trial__DeviceKeySalt: "${TRIAL_DEVICE_KEY_SALT}"
      # Caddy terminates TLS on the Docker bridge; without this every request
      # looks like it came from the proxy and shares one rate-limit bucket.
      ReverseProxy__KnownNetworks__0: "172.16.0.0/12"
      ASPNETCORE_ENVIRONMENT: "Production"
      Trial__DurationMinutes: "0"
      Trial__DurationDays: "2"
    depends_on:
      - postgres
    networks:
      - default
      # Shared with the bot's compose, so the bot reaches us at
      # http://fatvpn-bff:5030. Remove this and pairing stops working.
      - fatvpn_default

  caddy:
    image: caddy:2-alpine
    container_name: fatvpn-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # The privacy policy pages Caddy serves at /privacy and /privacy/ru. Bind
      # mount, not a named volume: they are tracked in git next to this file, so
      # `git pull` on the server is all it takes to publish a correction.
      - ./legal:/srv/legal:ro
      # Named volumes rather than bind mounts: /data holds the issued
      # certificate and the ACME account key, and losing those means re-issuing
      # on every deploy — which Let's Encrypt rate-limits.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - bff
    networks:
      - default

volumes:
  fatvpn-postgres-data:
  caddy-data:
  caddy-config:

networks:
  # Declared by the bot's compose (/opt/FatVPN/docker-compose.yml), which is not
  # in this repository. External so a deploy here never tries to own it.
  fatvpn_default:
    external: true
