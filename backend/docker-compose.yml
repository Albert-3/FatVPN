services:
  postgres:
    image: postgres:16
    container_name: fatvpn-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fatvpn
      POSTGRES_PASSWORD: fatvpn_dev
      POSTGRES_DB: fatvpn
    ports:
      - "5433:5432"
    volumes:
      - fatvpn-postgres-data:/var/lib/postgresql/data

  bff:
    build: .
    container_name: fatvpn-bff
    restart: unless-stopped
    ports:
      - "127.0.0.1:5030:5030"
    environment:
      ConnectionStrings__FatVpn: "Host=fatvpn-postgres;Port=5432;Database=fatvpn;Username=fatvpn;Password=fatvpn_dev"
      Jwt__Secret: "${JWT_SECRET}"
      Jwt__Issuer: "FatVpn.Bff"
      Jwt__Audience: "FatVpn.App"
      Remnawave__BaseUrl: "https://z.fatvdsnvv.space"
      Remnawave__ApiToken: "${REMNAWAVE_API_TOKEN}"
      Bot__Secret: "${BOT_SECRET}"
      # Without this the device-key hash is unsalted, so a leaked database gives
      # up its per-install identifiers to a rainbow table. Startup refuses to run
      # without it outside Development.
      Trial__DeviceKeySalt: "${TRIAL_DEVICE_KEY_SALT}"
      # Caddy terminates TLS on the Docker bridge; without this every request
      # looks like it came from the proxy and shares one rate-limit bucket.
      ReverseProxy__KnownNetworks__0: "172.16.0.0/12"
      ASPNETCORE_ENVIRONMENT: "Production"
    depends_on:
      - postgres

volumes:
  fatvpn-postgres-data:
