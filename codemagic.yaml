workflows:
  ios-libbox-xcframework:
    name: iOS Libbox.xcframework build
    instance_type: mac_mini_m2
    # gomobile builds both cores from source here (~20-30 minutes), and a cold
    # Homebrew/Go install on the runner is on top of that.
    max_build_duration: 120
    environment:
      xcode: latest
    scripts:
      - name: Build Libbox.xcframework via gomobile
        script: |
          # Builds both cores into one framework — see the script header for
          # why sing-box and Xray cannot ship as two.
          bash app/packages/singbox_mm/tool/build_fatcore_ios.sh
      - name: Zip xcframework for download
        script: |
          cd app/packages/singbox_mm/ios/Frameworks
          # -y preserves symlinks instead of dereferencing them — umbrella
          # framework bundles have Versions/Current -> Versions/A (and
          # Libbox.framework/Libbox -> Versions/Current/Libbox), so a plain
          # `zip -r` stores the ~150MB binary 3 times (once real, twice
          # dereferenced) and roughly triples the artifact for nothing.
          zip -ry Libbox.xcframework.zip Libbox.xcframework
    artifacts:
      - app/packages/singbox_mm/ios/Frameworks/Libbox.xcframework.zip

  ios-release:
    name: iOS release (TestFlight)
    instance_type: mac_mini_m2
    # 120 rather than 60: when the committed framework is stale this workflow
    # builds it here (see the step below), which alone eats ~20-30 minutes.
    max_build_duration: 120
    integrations:
      app_store_connect: Codemagic-Admin
    environment:
      # Pinned: `stable` moves under us, and a Flutter upgrade that changes
      # codegen or plugin registration breaks a release build with nothing
      # changed in this repository. Bump deliberately, alongside the SDK
      # constraint in app/pubspec.yaml.
      flutter: 3.44.4
      # Deliberately NOT pinned, unlike Flutter above. Apple raises the minimum
      # SDK an App Store Connect upload will accept once a year, so any Xcode
      # version written here stops working on a date nobody set a reminder for —
      # and it fails at the *upload*, after a full build. `latest` is the value
      # that keeps satisfying that rule; pin it (e.g. `xcode: 16.2`) only to
      # reproduce a specific past build, and expect uploads to be rejected.
      # Same reasoning for CocoaPods, which has to keep up with Xcode.
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.fatvpn.fatvpnApp
    scripts:
      - name: Pull Git LFS files (Libbox.xcframework binaries)
        script: |
          git lfs install
          git lfs pull
      - name: Check the framework carries the Xray bridge (build it if not)
        script: |
          # Libbox.xcframework is a committed build artifact, so it can lag the
          # Go module behind it — it did from the day the second core was
          # written. Failing here would mean a manual round trip (run the
          # ios-libbox-xcframework workflow, download the zip, unzip, commit)
          # before any TestFlight build, so build it on this runner instead.
          #
          # This only runs when the check fails, and it uploads the framework
          # it built as an artifact: commit that zip and the step is a no-op
          # again, at no cost to build time.
          echo "Note: if the check below fails, the framework is built right"
          echo "here — the guard's 'run the ios-libbox-xcframework workflow'"
          echo "hint does not apply to this workflow."
          if bash app/packages/singbox_mm/tool/check_xray_bridge.sh; then
            exit 0
          fi
          echo "Building Libbox.xcframework (sing-box + Xray) on this runner..."
          # The runner image can ship a Go older than fatcore/go.mod asks for,
          # which surfaces deep inside gomobile. Check it up front instead.
          REQUIRED_GO="$(sed -n 's/^go //p' app/packages/singbox_mm/tool/fatcore/go.mod | head -n1)"
          go_ok() {
            command -v go >/dev/null 2>&1 || return 1
            [ "$(printf '%s\n%s\n' "$REQUIRED_GO" "$(go env GOVERSION | sed 's/^go//')" \
                 | sort -t. -k1,1n -k2,2n -k3,3n | head -n1)" = "$REQUIRED_GO" ]
          }
          go_ok || brew install go || brew upgrade go || true
          go_ok || {
            echo "Go $REQUIRED_GO or newer is required to build the core;" >&2
            echo "this runner has: $(go version 2>/dev/null || echo 'no Go at all')." >&2
            exit 1
          }
          go version
          bash app/packages/singbox_mm/tool/build_fatcore_ios.sh
          cd app/packages/singbox_mm/ios/Frameworks
          # -y keeps the symlinks inside the framework bundle instead of
          # storing the binary three times — same reason as in the dedicated
          # ios-libbox-xcframework workflow above.
          zip -ry Libbox.xcframework.zip Libbox.xcframework
      - name: Flutter pub get
        script: |
          cd app
          flutter pub get
      - name: Analyze and test
        script: |
          # `set -e` is what makes this a gate at all. A script's exit code is
          # the exit code of its *last* command, so without it a failing
          # `flutter analyze` here would be printed, ignored, and published:
          # only the final `flutter test` would have been able to stop the
          # build. Four of the five checks were decorative.
          set -e
          # The quality gate. Without it this workflow would take whatever is on
          # the branch straight to TestFlight — a build number is consumed on
          # upload and never reissued, so a red build here is cheap and a bad
          # one on a tester's phone is not.
          cd app
          flutter analyze
          flutter test
          cd packages/singbox_mm
          flutter analyze
          flutter test
      - name: Add PacketTunnel (Network Extension) target
        script: |
          # Pinned: this gem rewrites Runner.xcodeproj (add_packet_tunnel_target.rb),
          # and a major version bump would change that structure silently.
          # Installing a version does not select it — CocoaPods pulls xcodeproj
          # in too, and RubyGems activates the newest one installed. The script
          # therefore declares `gem 'xcodeproj', '~> 1.27'` before its require;
          # this line only guarantees a matching version is present to activate.
          gem install xcodeproj -v 1.27.0 --no-document
          ruby app/ios/tool/add_packet_tunnel_target.rb
      - name: Add FatVpnWidget (WidgetKit) target
        script: |
          # Must follow the PacketTunnel step: this script also adds the shared
          # widget-snapshot file to that target, which is how the tunnel tells
          # the widget about starts and stops that happen without the app.
          # The gem is already installed by the step above.
          ruby app/ios/tool/add_widget_target.rb
      - name: Pod install
        script: |
          cd app/ios
          pod install
      - name: Fetch the widget's provisioning profile explicitly
        script: |
          set -e
          # The `ios_signing` block fetches signing files once, before any of
          # these scripts run, by substring match on com.fatvpn.fatvpnApp. That
          # covered Runner and PacketTunnel but not FatVpnWidget (build 143
          # failed with the widget's profile absent while the portal had it),
          # and whatever the reason — the profile appearing between the fetch
          # and the build, or the fetch's own scope — the fix is the same:
          # ask for this bundle id by name, here, where the answer is current.
          #
          # Idempotent and cheap: if the integration already saved the profile,
          # this re-saves the same file into the same directory that
          # `use-profiles` reads. `--create` is the backstop for an App ID that
          # exists with no profile on it; it cannot invent the App Groups
          # capability, which stays a portal job (see docs/home-widgets-spec.md).
          #
          # Credentials come from the app_store_connect integration above, which
          # exports APP_STORE_CONNECT_* into the environment the CLI reads.
          app-store-connect fetch-signing-files com.fatvpn.fatvpnApp.FatVpnWidget \
            --platform IOS \
            --type IOS_APP_STORE \
            --strict-match-identifier \
            --create
      - name: Set up code signing settings on Xcode project
        script: |
          cd app
          xcode-project use-profiles
      - name: Verify a profile was fetched for every bundle id
        script: |
          set -e
          # `use-profiles` configures a target only when it finds a profile whose
          # App ID matches that target's bundle id, and says nothing at all when
          # it does not. The target is then left on automatic signing with no
          # team, and the build dies in the archive step with
          #   Signing for "FatVpnWidget" requires a development team
          # (build 142) — a message that names neither the missing App ID nor
          # the portal page that fixes it.
          #
          # ios_signing.bundle_identifier is matched as a *substring*, so the
          # extensions are covered by the same fetch — but only those App IDs
          # that already exist in the portal are. The `--create` behind it does
          # nothing here either: the search for com.fatvpn.fatvpnApp does match
          # something, so nothing is considered missing and no App ID is made.
          #
          # A wildcard profile (TEAMID.*) deliberately does not count: every
          # bundle id below carries App Groups, which a wildcard App ID cannot
          # have, so accepting one would only move the failure later.
          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          MISSING=""
          for BUNDLE_ID in com.fatvpn.fatvpnApp \
                           com.fatvpn.fatvpnApp.PacketTunnel \
                           com.fatvpn.fatvpnApp.FatVpnWidget; do
            FOUND=""
            for PROFILE in "$PROFILES_DIR"/*.mobileprovision; do
              [ -e "$PROFILE" ] || continue
              # A .mobileprovision is a CMS blob; the decoded plist carries the
              # App ID as <string>TEAMID.the.bundle.id</string>
              # (Entitlements.application-identifier).
              if security cms -D -i "$PROFILE" 2>/dev/null \
                   | grep -qF ".$BUNDLE_ID</string>"; then
                FOUND=1
                break
              fi
            done
            [ -n "$FOUND" ] || MISSING="$MISSING $BUNDLE_ID"
          done
          if [ -n "$MISSING" ]; then
            echo "No provisioning profile was fetched for:$MISSING" >&2
            echo "" >&2
            echo "Either the App ID or its App Store profile is missing. At" >&2
            echo "developer.apple.com > Certificates, Identifiers & Profiles:" >&2
            echo " * Identifiers: an explicit App ID with the App Groups" >&2
            echo "   capability bound to group.com.fatvpn.fatvpnApp (the widget" >&2
            echo "   and the tunnel read the shared snapshot through it)." >&2
            echo " * Profiles: an App Store profile on that App ID. Do not wait" >&2
            echo "   for this build to create one — on this account every" >&2
            echo "   profile is made by hand; the integration creates only the" >&2
            echo "   certificate." >&2
            exit 1
          fi
          echo "A provisioning profile is present for every bundle id."
      - name: Build ipa
        script: |
          # App Store Connect consumes a build number on upload and refuses to
          # ever see it again, including after a run that failed later on. Kept
          # in pubspec.yaml, the number therefore had to be bumped by hand
          # before every attempt, and a forgotten bump cost a full build.
          #
          # The commit count is monotonic on master and needs no bookkeeping,
          # so it is the build number. Version *name* still comes from pubspec.
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            # A shallow clone would count a handful of commits and hand App
            # Store Connect a number below what it already has.
            git fetch --unshallow
          fi
          BUILD_NUMBER="$(git rev-list --count HEAD)"
          echo "Build number: $BUILD_NUMBER (commits on HEAD)"
          cd app
          flutter build ipa --release \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist=/Users/builder/export_options.plist
      - name: Verify App Group entitlement survived signing
        script: |
          # An App ID without the App Groups capability does not necessarily
          # fail the signature — the entitlement can be stripped instead, and
          # the only symptom is containerURL() returning nil at runtime: the
          # extension's diagnostics become unreadable, getLastError answers
          # "APP_GROUP_UNAVAILABLE", and the logout cleanup silently does
          # nothing. Catch that here rather than on a tester's device.
          #
          # Read from the exported .ipa, not from build/ios/**/Runner.app: the
          # export re-signs the bundle against export_options.plist, so the
          # archive can carry an entitlement the uploaded build does not. That
          # re-signing is exactly the step that can strip it.
          set -e
          IPA="$(ls app/build/ios/ipa/*.ipa 2>/dev/null | head -n1)"
          if [ -z "$IPA" ]; then
            # Not "nothing to check": the build above was supposed to produce
            # one. Passing here would report a green gate that verified nothing.
            echo "No .ipa under app/build/ios/ipa — nothing was verified." >&2
            exit 1
          fi
          rm -rf /tmp/ipa-check
          mkdir -p /tmp/ipa-check
          unzip -q "$IPA" -d /tmp/ipa-check
          APP="$(find /tmp/ipa-check/Payload -maxdepth 1 -name '*.app' -type d | head -n1)"
          for BUNDLE in "$APP" "$APP/PlugIns/PacketTunnel.appex" "$APP/PlugIns/FatVpnWidget.appex"; do
            # A missing appex is the worst outcome here, not a skippable one:
            # it means add_packet_tunnel_target.rb (or add_widget_target.rb)
            # stopped embedding its extension and the app ships with no tunnel
            # — or with a widget that can never read anything — at all.
            if [ ! -d "$BUNDLE" ]; then
              echo "Bundle missing from the exported .ipa: $BUNDLE" >&2
              exit 1
            fi
            echo "--- $BUNDLE ---"
            # stderr is deliberately not silenced: when codesign itself fails,
            # its message is the diagnosis. Hidden, the grep below would
            # misreport the failure as a missing entitlement.
            codesign -d --entitlements :- "$BUNDLE" > /tmp/ents.xml
            cat /tmp/ents.xml
            grep -q "application-groups" /tmp/ents.xml || {
              echo "Missing App Group entitlement in $BUNDLE" >&2
              exit 1
            }
          done
    artifacts:
      - app/build/ios/ipa/*.ipa
      # Only produced when the step above had to rebuild the framework.
      # Download it, unzip over app/packages/singbox_mm/ios/Frameworks/ and
      # commit it (Git LFS) so later builds skip that ~20-30 minute step.
      - app/packages/singbox_mm/ios/Frameworks/Libbox.xcframework.zip
    publishing:
      app_store_connect:
        auth: integration
        # Upload the build to App Store Connect only. Internal testers receive
        # processed builds automatically, so we don't submit to external
        # TestFlight beta review — that step requires Beta App Review test info
        # (feedback email + reviewer contact) and otherwise red-fails the build.
        submit_to_testflight: false

  ios-unsigned:
    name: iOS build (unsigned validation)
    instance_type: mac_mini_m2
    # Same reason as ios-release: a stale framework is built here.
    max_build_duration: 120
    environment:
      # Same pin as ios-release, so a validation build validates the same
      # toolchain the release one uses. See there for why Xcode is not pinned.
      flutter: 3.44.4
      xcode: latest
      cocoapods: default
    scripts:
      - name: Pull Git LFS files (Libbox.xcframework binaries)
        script: |
          git lfs install
          git lfs pull
      - name: Check the framework carries the Xray bridge (build it if not)
        script: |
          # Libbox.xcframework is a committed build artifact, so it can lag the
          # Go module behind it — it did from the day the second core was
          # written. Failing here would mean a manual round trip (run the
          # ios-libbox-xcframework workflow, download the zip, unzip, commit)
          # before any TestFlight build, so build it on this runner instead.
          #
          # This only runs when the check fails, and it uploads the framework
          # it built as an artifact: commit that zip and the step is a no-op
          # again, at no cost to build time.
          echo "Note: if the check below fails, the framework is built right"
          echo "here — the guard's 'run the ios-libbox-xcframework workflow'"
          echo "hint does not apply to this workflow."
          if bash app/packages/singbox_mm/tool/check_xray_bridge.sh; then
            exit 0
          fi
          echo "Building Libbox.xcframework (sing-box + Xray) on this runner..."
          # The runner image can ship a Go older than fatcore/go.mod asks for,
          # which surfaces deep inside gomobile. Check it up front instead.
          REQUIRED_GO="$(sed -n 's/^go //p' app/packages/singbox_mm/tool/fatcore/go.mod | head -n1)"
          go_ok() {
            command -v go >/dev/null 2>&1 || return 1
            [ "$(printf '%s\n%s\n' "$REQUIRED_GO" "$(go env GOVERSION | sed 's/^go//')" \
                 | sort -t. -k1,1n -k2,2n -k3,3n | head -n1)" = "$REQUIRED_GO" ]
          }
          go_ok || brew install go || brew upgrade go || true
          go_ok || {
            echo "Go $REQUIRED_GO or newer is required to build the core;" >&2
            echo "this runner has: $(go version 2>/dev/null || echo 'no Go at all')." >&2
            exit 1
          }
          go version
          bash app/packages/singbox_mm/tool/build_fatcore_ios.sh
          cd app/packages/singbox_mm/ios/Frameworks
          # -y keeps the symlinks inside the framework bundle instead of
          # storing the binary three times — same reason as in the dedicated
          # ios-libbox-xcframework workflow above.
          zip -ry Libbox.xcframework.zip Libbox.xcframework
      - name: Flutter pub get
        script: |
          cd app
          flutter pub get
      - name: Add PacketTunnel (Network Extension) target
        script: |
          gem install xcodeproj -v 1.27.0 --no-document
          ruby app/ios/tool/add_packet_tunnel_target.rb
      - name: Add FatVpnWidget (WidgetKit) target
        script: |
          # Order matters — see the same step in ios-release.
          ruby app/ios/tool/add_widget_target.rb
      # Kept in this workflow only: it is the debug/validation one, and the
      # ~30-60s `-showBuildSettings` pass has no business in the pipeline that
      # publishes to TestFlight.
      - name: Diagnose PacketTunnel target build settings
        script: |
          cd app/ios
          for t in Runner PacketTunnel; do
            echo "--- $t ---"
            xcodebuild -showBuildSettings -project Runner.xcodeproj -target "$t" -configuration Debug 2>&1 \
              | grep -E "PRODUCT_NAME|WRAPPER_EXTENSION|TARGET_NAME|CONFIGURATION_BUILD_DIR|WRAPPER_NAME|ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES" || true
          done
      - name: Pod install
        script: |
          cd app/ios
          pod install
      - name: Build unsigned iOS
        script: |
          cd app
          flutter build ios --debug --no-codesign
    artifacts:
      - app/build/ios/iphoneos/*.app
      # See ios-release: present only if the framework was rebuilt here.
      - app/packages/singbox_mm/ios/Frameworks/Libbox.xcframework.zip
